<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Weird Web October 2026 · Akshay Kumar Gupta</title>
	<meta name="description" content="A small website every day of October 2026, one for each Weird Web October theme.">
	<link rel="stylesheet" href="../assets/css/style.css?v=2">
</head>
<body>
	<main class="page wide">
		<a class="back" href="../">← Akshay Kumar Gupta</a>

		<h1>Weird Web October 2026</h1>
		<p class="muted">A small website every day of October, one for each day's theme from <a href="https://weirdweboctober.website/">weirdweboctober.website</a>.</p>

		<div class="calendar" id="calendar">
			<div class="dow">Mon</div><div class="dow">Tue</div><div class="dow">Wed</div><div class="dow">Thu</div><div class="dow">Fri</div><div class="dow">Sat</div><div class="dow">Sun</div>
		</div>
	</main>

	<script src="days.js"></script>
	<script>
		(function () {
			var cal = document.getElementById("calendar");
			var today = window.wwoToday();

			// October 1, 2026 is a Thursday, so pad Mon to Wed
			var firstDow = (new Date(2026, 9, 1).getDay() + 6) % 7;
			for (var i = 0; i < firstDow; i++) {
				var pad = document.createElement("div");
				pad.className = "pad";
				cal.appendChild(pad);
			}

			window.WWO_DAYS.forEach(function (d) {
				var el = document.createElement("div");
				el.className = "day" + (d.day === today ? " today" : "") + (d.day > today ? " later" : "");

				var theme = d.url
					? '<a class="theme" href="' + d.url + '">' + d.theme + "</a>"
					: '<span class="theme">' + d.theme + "</span>";
				var note = d.day === today && !d.url ? '<span class="note">today</span>' : "";

				el.innerHTML = '<span class="num">' + d.day + "</span>" + theme + note;
				cal.appendChild(el);
			});
		})();
	</script>
</body>
</html>
